<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오랜만에 시작한 마인크래프트</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
font-family:"Noto Sans KR", sans-serif;
margin:0;
background:linear-gradient(to bottom,#2e7d32,#a5d6a7);
line-height:1.9;
color:#333;
overflow-x:hidden;
}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:#2e7d32;border-radius:10px;}

header{
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('start.jpg');
background-size:cover;
color:white;
padding:90px 20px;
text-align:center;
}

header h1{
font-family:'Press Start 2P';
font-size:26px;
}

.container{
max-width:800px;
margin:-40px auto 40px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.fade{
opacity:0;
transform:translateY(30px);
transition:1s;
}
.fade.show{
opacity:1;
transform:none;
}

@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(-5px,5px)}
50%{transform:translate(5px,-5px)}
75%{transform:translate(-5px,5px)}
100%{transform:translate(0)}
}
.shake{
animation:shake 0.4s;
}

.big{
display:block;
font-size:26px;
text-align:center;
margin:40px 0;
color:#2e7d32;
font-weight:bold;
transition:0.3s;
}
.big:hover{transform:scale(1.05);}

.highlight{
display:block;
font-size:20px;
margin:30px 0;
font-weight:bold;
color:#1b5e20;
}

.image{
margin:40px 0;
text-align:center;
}
.image img{
width:100%;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.4s;
}
.image img:hover{
transform:scale(1.05);
}

.dialog{
background:#f1f8e9;
padding:20px;
border-left:6px solid #2e7d32;
margin:25px 0;
}

.scene{
margin-top:70px;
padding-top:40px;
border-top:3px double #ddd;
}

footer{
text-align:center;
padding:40px;
color:#2e7d32;
}

</style>
</head>

<body>

<header>
<h1>오랜만에 시작한 마인크래프트</h1>
<p>친구와 함께 시작한 네모난 세상의 모험</p>
</header>

<div class="container">

<div class="fade">
<p>오랜만에 친구와 함께 시작한 마인크래프트.</p>
</div>

<div class="image fade">
<img src="start.jpg">
</div>

<div class="fade">
<p>
우리가 자라는 동안 수많은 업데이트가 이루어졌지만, 이 네모난 세상은 여전히 설렘을 준다.
</p>
</div>

<span class="highlight fade">지구보다 몇 배는 넓은 세계</span>

<div class="scene fade">
<p class="big">첫 번째 탐험의 마지막 밤</p>

<div class="dialog">
“자는 동안 나 잠깐 화장실.”<br>
“그럼 난 먹을 것 좀 가져올게.”
</div>

<div class="image fade" id="boom">
<img src="die.jpg">
</div>

</div>

</div>

<footer>
2026/03/17
</footer>

<script>

const fades=document.querySelectorAll('.fade');

window.addEventListener('scroll',()=>{
fades.forEach(el=>{
const top=el.getBoundingClientRect().top;
if(top<window.innerHeight-100){
el.classList.add('show');
}
});
});

setTimeout(()=>{
document.getElementById('boom').classList.add('shake');
},2000);

</script>

</body>
</html>
